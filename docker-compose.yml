version: '3.8'

services:
  prompt-nest:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ADMIN_EMAIL=admin@example.com
      - ADMIN_PASSWORD=changeme
      - SESSION_SECRET=${SESSION_SECRET:-changeme-to-random-string}
      - PORT=3000
      - DATABASE_PATH=/data/promptnest.db
    volumes:
      - prompt-nest-data:/data
    restart: unless-stopped

volumes:
  prompt-nest-data:
